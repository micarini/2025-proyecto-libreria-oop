<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
  <title>Panel de Administración</title>
</head>
<body>
  <h1 id="agregar" class="txt-c">Agregar nuevo contenido</h1>

  <form id="formulario">
    <div>
      <label for="titulo">Título:</label>
      <input type="text" id="titulo" name="titulo" required>
    </div>
    
    <div>
      <label for="tipo">Tipo:</label>
      <select id="tipo" name="tipo" required>
        <option value="libro">Libro</option>
        <option value="pelicula">Película</option>
        <option value="cd">CD</option>
      </select>
    </div>

    <div>
      <label for="autor">Autor / Director / Artista:</label>
      <input type="text" id="autor" name="autor" required>
    </div>

    <div>
      <label for="year">Año:</label>
      <select id="year" name="year" required>
        <option value="">Selecciona un año</option>
      </select>
    </div>

    <div>
      <label for="descripcion">Descripción:</label>
      <textarea id="descripcion" name="descripcion" rows="4" cols="40"></textarea>
    </div>

    <div>
      <label for="imagen">Imagen:</label>
      <input type="file" id="imagen" name="imagen" accept="image/*" required>
    </div>

    <div id="campo-paginas" class="campo-dinamico oculto">
      <label for="paginas">Páginas:</label>
      <input type="number" id="paginas" name="paginas" min="1">
    </div>
    
    <div id="campo-duracion" class="campo-dinamico oculto">
      <label for="duracion">Duración (minutos):</label>
      <input type="number" id="duracion" name="duracion" min="1">
    </div>
    
    <div id="campo-canciones" class="campo-dinamico oculto">
      <label for="canciones">Canciones:</label>
      <input type="number" id="canciones" name="canciones" min="1">
    </div>
    
    <div>
      <label for="genero">Género:</label>
      <input type="text" id="genero" name="genero">
    </div>
    
    <div>
      <label for="precio">Precio:</label>
      <input type="number" id="precio" name="precio" step="0.01" min="0">
    </div>
    

    <button id="boton-guardar" type="submit">Guardar</button>
  </form>

  <p id="mensaje" class="txt-c"></p>

  <a href="index.html" class="volver-inicio flex center" title="Volver al inicio">←</a>

  <!-- checkbox que activa el cambio de tema -->
  <input type="checkbox" id="theme-toggle">

  <!-- BOTON DARK MODE -->
  <label for="theme-toggle" class="toggle-button flex center">
      <!-- sol (modo claro) -->
      <svg class="icon sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="5"></circle>  <!-- circulo central -->
      <!-- rayos del sol -->
      <line x1="12" y1="1" x2="12" y2="3"></line>
      <line x1="12" y1="21" x2="12" y2="23"></line>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
      <line x1="1" y1="12" x2="3" y2="12"></line>
      <line x1="21" y1="12" x2="23" y2="12"></line>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>

      <!-- luna (modo oscuro) -->
      <svg class="icon moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path>
      </svg>
  </label>

<script src="assets/js/admin.js"></script>
</body>
</html>
