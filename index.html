<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
    <title>Librería Multimedia</title>
</head>
<body>
 
  <!--SECTION-->
  <section id="section-galeria">
   <h2 class="fw500 relative txt-c">Librería Multimedia</h2>
   <p class="em08 txt-c relative">Presionar en la card para mas información</p>
   <div class="button-container flex center">
       <button id="boton1" class="btn-prod em1 cursorp relative uppercase flex wrap center txtnegro">Libros</button>
       <button id="boton2" class="btn-prod em1 cursorp relative uppercase flex wrap center txtnegro">CDs</button>
       <button id="boton3" class="btn-prod em1 cursorp relative uppercase flex wrap center txtnegro">Peliculas</button>    
   </div>

   <!--contenedor dinámico de tarjetas-->
  <div id="galeria-contenido" class="galeria flex justify-c wrap"></div>
  </section>

  <div id="modal" class="modal oculto">
    <div class="modal-contenido">
      <span class="cerrar" id="cerrar-modal">&times;</span>
      <h2 id="modal-titulo"></h2>
      <p id="modal-descripcion"></p>  
    </div>
  </div>
    
  <a href="admin.html" class="boton-agregar" title="Agregar nuevo contenido">＋</a>

  <!-- checkbox que activa el cambio de tema -->
  <input type="checkbox" id="theme-toggle">

  <!-- BOTON DARK MODE -->
  <label for="theme-toggle" class="toggle-button flex center">
      <!-- sol (modo claro) -->
      <svg class="icon sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="5"></circle>  <!-- circulo central -->
      <!-- rayos del sol -->
      <line x1="12" y1="1" x2="12" y2="3"></line>
      <line x1="12" y1="21" x2="12" y2="23"></line>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
      <line x1="1" y1="12" x2="3" y2="12"></line>
      <line x1="21" y1="12" x2="23" y2="12"></line>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>

      <!-- luna (modo oscuro) -->
      <svg class="icon moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path>
      </svg>
  </label>

    
  <script src="assets/js/script.js"></script>
</body>
</html>
